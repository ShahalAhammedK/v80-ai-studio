services:
  - type: web
    name: v80-ai-studio
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Secrets are set in the Render dashboard, never committed here.
      - key: OPENAI_API_KEY
        sync: false
      - key: IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: IMAGE_PROVIDER
        value: openai
      - key: CHAT_MODEL
        value: gpt-5.6-luna
      - key: EXPLABS_API_KEY
        sync: false
      - key: EXPLABS_BASE_URL
        value: https://api.experientiallabs.ai/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "12"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
