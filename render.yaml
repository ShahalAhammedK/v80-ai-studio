services:
  - type: web
    name: v80-ai-studio
    # Docker, to match the committed Dockerfile — it pins Python 3.11 and owns
    # the install and start commands, so they aren't duplicated here.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      # Secrets are set in the Render dashboard, never committed here.
      - key: OPENAI_API_KEY
        sync: false
      - key: IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: IMAGE_PROVIDER
        value: openai
      - key: CHAT_MODEL
        value: gpt-5.6-luna
      - key: EXPLABS_API_KEY
        sync: false
      - key: EXPLABS_BASE_URL
        value: https://api.experientiallabs.ai/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "12"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
