services:
  - type: web
    name: v80-ai-studio
    # Docker, to match the committed Dockerfile — it pins Python 3.11 and owns
    # the install and start commands, so they aren't duplicated here.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      # Secrets are set in the Render dashboard (Environment -> Add variable),
      # never committed here. A key was briefly committed to this file on a
      # public repo and OpenAI revoked it within the hour; the replacement
      # lives only in the dashboard.
      #
      # Note: this service was created as a plain Web Service, not from this
      # blueprint, so Render does not read these envVars at all. They are kept
      # as documentation of what the app expects, and for anyone deploying
      # this repo via New -> Blueprint.
      - key: OPENAI_API_KEY
        sync: false
      - key: IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: IMAGE_PROVIDER
        value: openai
      - key: CHAT_MODEL
        value: gpt-5.6-luna
      - key: EXPLABS_API_KEY
        sync: false
      - key: EXPLABS_BASE_URL
        value: https://api.experientiallabs.ai/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "12"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
