services:
  - type: web
    name: v80-ai-studio
    # Docker, to match the committed Dockerfile — it pins Python 3.11 and owns
    # the install and start commands, so they aren't duplicated here.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      # ---------------------------------------------------------------------
      # WARNING: live API key committed below, at the repo owner's explicit
      # request, in a PUBLIC repository.
      #
      # Expect this key to be found by automated scrapers and revoked by
      # OpenAI. When the app starts reporting rejected credentials, that is
      # what happened -- issue a new key at
      # https://platform.openai.com/api-keys and set it in the Render
      # dashboard (Environment -> OPENAI_API_KEY) rather than here.
      #
      # Deleting this line later does NOT unpublish the key: it remains in
      # git history, in every fork, and in any clone already taken. Revoking
      # it at OpenAI is the only action that actually disables it.
      # ---------------------------------------------------------------------
      - key: OPENAI_API_KEY
        value: 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
      - key: IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: IMAGE_PROVIDER
        value: openai
      - key: CHAT_MODEL
        value: gpt-5.6-luna
      - key: EXPLABS_API_KEY
        sync: false
      - key: EXPLABS_BASE_URL
        value: https://api.experientiallabs.ai/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "12"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
